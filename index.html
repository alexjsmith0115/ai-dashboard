<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Developer Productivity</title>
  <link rel="stylesheet" href="assets/styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"
          integrity="sha384-D/t0ZMqQW31H3az8ktEiNb39wyKnS82iFY52QPACM+IjKW3jDUhyIgh2PApRqJZs" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"
          integrity="sha384-bs/nf9FbdNouRbMiFcrcZfLXYPKiPaGVGplVbv7dLGECccEXDW+S3zjqSKR5ZEaD" crossorigin="anonymous"></script>
  <script src="assets/js/metrics.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/analysis.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/charts.js"></script>
  <script src="assets/js/demo.js"></script>
  <script src="assets/js/executive.js"></script>
  <script src="assets/js/explore.js"></script>
  <script src="assets/js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 16 16"><path d="M2 12l3.5-4 3 2.5L14 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        AI Developer Productivity
      </div>
      <nav class="tabs" id="tabs" role="tablist" aria-label="Dashboards" hidden>
        <button class="tab" role="tab" data-tab="exec" type="button">Executive summary</button>
        <button class="tab" role="tab" data-tab="explore" type="button">Explore</button>
      </nav>
      <div class="topbar-right">
        <span class="data-status" id="data-status"></span>
        <button class="btn" id="btn-load" type="button" hidden>Load data</button>
        <button class="btn" id="btn-settings" type="button" aria-pressed="false" hidden>Settings</button>
        <button class="btn ghost" id="btn-theme" type="button">Theme: auto</button>
      </div>
    </div>
  </header>
  <div class="settings-wrap" id="settings-wrap" hidden><div class="settings" id="settings"></div></div>
  <div class="filterbar" id="filterbar" hidden><div class="filterbar-inner" id="filterbar-inner"></div></div>
  <main id="main"></main>
  <input type="file" id="file-input" accept=".csv,text/csv" multiple hidden>
</body>
</html>
